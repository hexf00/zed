# Fork-only workflow: build a personal Zed for Windows.
# Upstream's release.yml is gated to zed-industries and left untouched;
# this file is additive so upstream merges stay conflict-free.
name: Fork Windows Build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Target CPU architecture
        type: choice
        default: x86_64
        options:
          - x86_64
          - aarch64
  # Manual-only by design: cold/warm builds are hours long, so nothing
  # triggers them implicitly. Public repos get free unlimited Actions
  # minutes; the only cap is 6h per job (timeout below leaves headroom).

permissions:
  contents: read

concurrency:
  group: fork-build-windows-${{ github.ref }}
  # Canceling is cheap with sccache: finished crate compilations are
  # already persisted, only in-flight work is lost. A newer manual run
  # supersedes an older one on the same ref.
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # First run is a cold 4-core release build (expect 2.5-4h);
    # warm sccache runs land around 30-60 min.
    timeout-minutes: 350
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      # sccache servers idle-exit after 10min by default; the big build
      # starts compiling well after the canary finished, keep it alive.
      SCCACHE_IDLE_TIMEOUT: "7200"
      # Fork slimming (see docs/fork-maintenance.md): skip remote_server,
      # the largest non-editor product we never use. Requires the matching
      # fork: commit in script/bundle-windows.ps1 on the custom branch.
      ZED_FORK_SKIP_REMOTE_SERVER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-windows-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Alias VS Community to Enterprise
        # script/bundle-windows.ps1 launches VsDevShell from a hardcoded
        # ...\2022\Community path. Locate the real VS installation with
        # vswhere (image-independent) and junction it to the expected path,
        # keeping the upstream script untouched (zero merge surface).
        shell: pwsh
        run: |
          $vsRoot = "C:\Program Files\Microsoft Visual Studio\2022"
          $launch = "$vsRoot\Community\Common7\Tools\Launch-VsDevShell.ps1"
          if (-not (Test-Path $launch)) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
            $installPath = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath | Select-Object -First 1
            if (-not $installPath) { throw "vswhere found no VS install with MSVC tools" }
            Write-Host "vswhere installationPath: $installPath"
            New-Item -ItemType Directory -Force -Path $vsRoot | Out-Null
            if (Test-Path "$vsRoot\Community") {
              Rename-Item "$vsRoot\Community" "Community.incomplete" -Force
            }
            New-Item -ItemType Junction -Path "$vsRoot\Community" -Target $installPath | Out-Null
            Write-Host "Junctioned Community -> $installPath"
          }
          if (-not (Test-Path $launch)) { throw "Launch-VsDevShell.ps1 still missing after junction" }
          Write-Host "Launch-VsDevShell.ps1 present"

      - name: Ensure Inno Setup 6
        # windows-latest images ship Inno Setup 6 at the path the bundle
        # script expects; choco is only a fallback for future image changes.
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Configure sccache wrapper + canary
        # RUSTC_WRAPPER is a cargo-level mechanism: a bare `rustc` call never
        # consults it. The canary therefore builds a tiny cargo project (a
        # staticlib, so no MSVC linker needed) and asserts the request
        # counter actually moved, for the absolute wrapper path and the
        # bare "sccache" name separately. Fails in ~1 min instead of
        # discovering a dead cache after 3 hours of compiling.
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=$env:SCCACHE_PATH" >> $env:GITHUB_ENV
          "SCCACHE_ERROR_LOG=$env:RUNNER_TEMP\sccache-error.log" >> $env:GITHUB_ENV
          & $env:SCCACHE_PATH --stop-server 2>$null
          & $env:SCCACHE_PATH --start-server
          $dir = Join-Path $env:RUNNER_TEMP "wrapcanary"
          New-Item -ItemType Directory -Force (Join-Path $dir "src") | Out-Null
          Set-Content (Join-Path $dir "Cargo.toml") @'
          [package]
          name = "wrapcanary"
          version = "0.0.0"
          edition = "2021"

          [lib]
          crate-type = ["staticlib"]
          '@
          Set-Content (Join-Path $dir "src\lib.rs") '#[no_mangle] pub extern "C" fn ping() {}'
          $manifest = Join-Path $dir "Cargo.toml"
          function Get-Requests {
            $s = (& $env:SCCACHE_PATH --show-stats) | Out-String
            if ($s -match "Compile requests\s+(\d+)") { return [int]$Matches[1] }
            return -1
          }
          $env:RUSTC_WRAPPER = $env:SCCACHE_PATH
          cargo build --manifest-path $manifest 2>&1 | Select-Object -Last 3
          $abs = Get-Requests
          Write-Host "== requests after absolute-path canary: $abs"
          # 2) pinned toolchain + --release + --target (real build flags)
          Set-Content (Join-Path $dir "src\lib.rs") '#[no_mangle] pub extern "C" fn ping2() {}'
          rustup run 1.98.1 cargo build --release --target x86_64-pc-windows-msvc --manifest-path $manifest 2>&1 | Select-Object -Last 2
          $pinned = Get-Requests
          Write-Host "== requests after pinned-toolchain canary: $pinned"
          if ($pinned -le $abs) {
            throw "sccache does not engage with the pinned 1.98.1 toolchain (requests $abs -> $pinned)."
          }

          # 3) the real invocation: repo root, bundle-config.toml, --release,
          # --target, a first-party crate (also pre-banks its compiles)
          $before = $pinned
          Push-Location $env:GITHUB_WORKSPACE
          rustup target add x86_64-pc-windows-msvc --toolchain 1.98.1 2>&1 | Out-Null
          cargo --config .cargo/bundle-config.toml check -p sqlez_macros --release --target x86_64-pc-windows-msvc 2>&1 | Select-Object -Last 2
          Pop-Location
          $real = Get-Requests
          Write-Host "== requests after real-invocation canary: $real"
          if ($real -le $before) {
            throw "sccache does not engage for the real repo/config/target invocation (requests $before -> $real)."
          }
          Write-Host "sccache canary OK (absolute=$abs, pinned=$pinned, real=$real)"

      - name: Bundle Windows
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture ${{ inputs.architecture || 'x86_64' }}

      - name: Show sccache stats
        shell: pwsh
        run: |
          & $env:SCCACHE_PATH --show-stats
        if: always()

      - name: Upload sccache error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sccache-error-log
          path: ${{ runner.temp }}/sccache-error.log
          if-no-files-found: ignore

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Zed-Windows-Installer-${{ inputs.architecture || 'x86_64' }}
          path: |
            target/Zed-*.exe
            target/ZedEditorUserSetup-*.exe
          if-no-files-found: error

      - name: Upload remote server
        uses: actions/upload-artifact@v4
        if: env.ZED_FORK_SKIP_REMOTE_SERVER != '1'
        with:
          name: zed-remote-server-windows-${{ inputs.architecture || 'x86_64' }}
          path: target/zed-remote-server-windows-*.zip
          if-no-files-found: error
